<style>
.dip { background: var(--white); border: 3px double var(--ink); border-radius: var(--r-md); padding: clamp(24px, 6vw, 60px) clamp(18px, 5vw, 56px); text-align: center; position: relative; box-shadow: var(--shadow-lift); animation: rise .8s var(--ease-out); }
.dip::before { content: '※'; position: absolute; top: 14px; left: 18px; color: var(--electric); font-size: 1.4rem; } .dip::after { content: '※'; position: absolute; bottom: 14px; right: 18px; color: var(--electric); font-size: 1.4rem; }
.dip h2 { font: 800 var(--step-3)/1.05 var(--font-display); letter-spacing: -.03em; margin-block: 8px; } .dip h2 em { font-style: italic; font-weight: 300; color: var(--electric); }
.dip input { font: italic 500 var(--step-2) var(--font-display); text-align: center; border: 0; border-bottom: 2px dashed var(--ink-ghost); background: none; width: min(100%, 420px); padding: 6px; color: var(--electric); }
.dip input:focus { outline: none; border-color: var(--electric); }
.dip .score { font: 900 clamp(3.4rem, 12vw, 5.5rem)/1 var(--font-display); letter-spacing: -.04em; }
.seal { display: inline-block; margin-top: 18px; padding: 10px 22px; border: 2px solid var(--gold); color: var(--gold); border-radius: var(--r-pill); font: 700 .72rem var(--font-mono); letter-spacing: .1em; transform: rotate(-2deg); }
.review a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--border-strong); color: inherit; text-decoration: none; }
.review a:hover b { color: var(--electric); }
@media print { main > .wrap > *:not(#exam) { display: none; } .dip { box-shadow: none; } .no-print { display: none !important; } }
</style>

<body data-ch="22">
<main class="ch"><div class="wrap">
<header class="ch-head">
  <h1><em>Graduation</em></h1>
  <p>Twelve questions drawn from all of Part I, set in the {name} edition. No looking things up. See what stuck — then collect your diploma.</p>
</header>

<section class="sec" id="exam">
  <div class="stage" id="game" style="margin-top:0"></div>
</section>
</div></main>
<script src="../js/regions.js"></script>
<script src="../js/global.js"></script>
<script>
{
const { $, $$, R, rid, money, t, pick, chapters, isDone, store } = DCC;
const d = R.a.debt, q = (ch, title, right, wrong, why) => ({ kicker: `Chapter ${chapters[ch - 1].roman} · ${chapters[ch - 1].title}`, ch, title, opts: [{ t: right, ok: true }, ...wrong.map(x => ({ t: x }))], explain: `<p>${why}</p>` });
const QS = [
  q(1, 'You tap your card in a café. Who actually pays the café?', 'The café’s own bank (the acquirer), which then collects from your bank through the network', ['Your bank pays the café directly', `${R.network} pays the café`], 'The network carries messages and nets the banks against each other. The acquirer pays the shop, minus the merchant fee.'),
  q(1, 'Why are credit card rewards ' + pick({ in: 'possible at all', us: 'so much richer in the US than in Europe', uk: 'so thin in the UK and EU', au: 'getting thinner in Australia' }) + '?', pick({ in: 'They are funded by interchange — a cut of the merchant fee — and by people who pay interest', us: 'US credit interchange is uncapped, so shops fund generous rewards', uk: 'Credit interchange is capped at 0.3%, leaving little to give back', au: 'The interchange cap was cut to 0.3% in October 2026' }), ['Banks pay them out of goodwill', 'The government subsidises them'], 'Rewards come out of the fee the shop pays. Where that fee is capped, rewards shrink.'),
  q(5, 'Your statement closes on the 5th. Which purchase gets the longest interest-free period?', 'One made on the 6th', ['One made on the 4th', 'One made on the due date'], `A purchase the day after the statement closes waits a whole cycle and then the grace period: about ${R.freeDays} days.`),
  q(6, `You owe ${money(d)} at ${R.apr}% and pay only the minimum each month. What happens?`, 'It takes many years, because the minimum shrinks as the balance shrinks', ['It is cleared in about a year', 'Interest stops once you have paid back what you borrowed'], 'A falling minimum keeps the debt alive. A fixed payment — even a modest one — clears it in a fraction of the time.'),
  q(7, 'When does interest start on cash taken out with a credit card?', 'Immediately — there is no interest-free period on cash', ['After the statement closes', 'After 30 days'], 'Plus a cash fee on top. It is the most expensive thing a card does.'),
  q(7, pick({ in: 'You pay two days after the due date. What do RBI’s rules say?', us: 'You are 60 days late. What may the issuer now do?', uk: 'What is the standard late-payment fee on a UK credit card?', au: 'You pay in full after two months of carrying a balance. What have you lost in the meantime?' }),
    pick({ in: 'No late fee or bureau report until the payment is more than three days overdue', us: 'Apply a penalty APR of around 30% to your balance', uk: '£12', au: 'Your interest-free days on new purchases' }),
    pick({ in: ['A late fee applies from the first minute', 'The card is cancelled'], us: ['Nothing beyond the late fee', 'Close the account without notice and keep your payments'], uk: ['£35', '5% of the balance'], au: ['Nothing — interest only applies to the old balance', 'Your credit limit'] }),
    pick({ in: 'The three-day buffer came in with RBI’s 2022 card directions. Interest still runs from the due date.', us: 'Six on-time payments in a row oblige the issuer to review it.', uk: 'Plus interest on the balance and a marker on your credit file.', au: 'Until a statement is paid in full, new purchases accrue interest from the day you make them.' })),
  q(8, 'Which habit moves a credit score the most?', 'Paying on time, every time', ['Earning a higher salary', 'Checking your score often'], 'Payment history outweighs everything else. Income is not on a credit report at all, and checking your own file costs nothing.'),
  q(10, `A caller from “${R.issuer} fraud team” knows your name and card number and asks you to ${pick({ in: 'read out the OTP you just received', us: 'read out a code and then move money with Zelle', uk: 'move your money to a safe account', au: 'read out a code and move money to a secure account' })}. You…`, 'Hang up and call the number on the back of your card', ['Do it — they knew your details', 'Ask them to prove who they are'], 'Knowing your details proves nothing; they leak constantly. No bank needs a code it just sent you, and no bank moves your money to keep it safe.'),
  q(12, 'A ' + money(R.a.laptop) + ' laptop you paid for by credit card never arrives and the seller has vanished. Your strongest move?', pick({ in: 'Raise a “goods not received” dispute with your card issuer', us: 'Dispute it with your issuer in writing within 60 days of the statement', uk: 'Claim from the card provider under Section 75', au: 'Ask your bank to raise a chargeback' }), ['Keep emailing the seller', 'Accept the loss — you authorised the payment'], pick({ in: 'The merchant must prove delivery. Disputes have deadlines, so do not wait.', us: 'The Fair Credit Billing Act gives you this right, and you need not pay the disputed amount meanwhile.', uk: 'Over £100, so the card provider is jointly liable with the seller.', au: 'Chargebacks have time limits; if the bank refuses, AFCA is free.' })),
  q(13, 'Abroad, the terminal offers to charge you in ' + R.homeCur + ' at a “guaranteed rate”. You choose…', 'The local currency', [R.homeCur + ' — no surprises', 'It makes no difference'], 'That offer is dynamic currency conversion: the terminal’s rate is typically 3–8% worse than your bank’s.'),
  q(17, 'A stranger on a marketplace asks you to pay by ' + pick({ in: 'UPI', us: 'Zelle', uk: 'bank transfer', au: 'PayID' }) + ' for a second-hand phone. Why hesitate?', 'An instant bank payment has no chargeback — once sent, it is gone', ['It is slower than a card', 'It costs more in fees'], 'The less you know the seller, the more you want a payment you can reverse.'),
  q(19, 'You have just received your first card. What do you do before spending anything?', 'Set autopay to the full statement balance', ['Ask for a higher limit', 'Spend up to the limit to build history faster'], 'It removes the single most expensive mistake — and a balance near the limit hurts a new file rather than helping it.')
];
function diploma(s, n, again) {
  const done = chapters.filter(c => isDone(c.n)).length, missed = QS.filter((x, i) => marks[i] === false), name = store.get('name', '');
  const line = s === n ? 'A perfect paper. You understand how this works better than most people who have carried a card for twenty years.' : s >= n * .75 ? 'A strong pass. You have a working command of the mechanics, the costs and the traps.' : s >= n * .5 ? 'A pass. The foundations are in place; the chapters below are worth another visit.' : 'Not this time — and that is fine. The chapters below are where to go back to. It sticks better the second time.';
  $('#game').innerHTML = `<div class="dip"><div class="eyebrow c-gold">${s >= n * .5 ? 'Certified' : 'Attended'}</div><h2>Diploma in <em>Card Literacy</em></h2><p class="muted">awarded to</p>
    <input id="nm" placeholder="type your name" value="${name.replace(/"/g, '&quot;')}" aria-label="Your name" maxlength="40">
    <p class="muted" style="margin-top:16px">${R.flag} ${R.name} edition</p><div class="score">${s} / ${n}</div><p style="max-width:48ch;margin:12px auto 0">${line}</p>
    <div class="seal">DECODING · CREDIT CARDS · ${new Date().toLocaleDateString(R.locale, { month: 'long', year: 'numeric' }).toUpperCase()}</div>
    <p class="small faint" style="margin-top:14px">${done} of ${chapters.length} chapters completed on this device</p>
    <div class="row no-print" style="justify-content:center;margin-top:20px"><button class="btn btn--primary" id="print">Print or save as PDF</button><button class="btn btn--outline" id="again">↻ Retake</button><a class="btn btn--ghost" href="../index.html#chapters">All chapters</a></div></div>
    <div class="callout no-print" style="margin-top:24px"><b>Part II · Inside the machine</b>You know how to use a card. Nine more chapters open up the industry behind it: the messages, the money movement, the pricing, the fraud engines and the issuer’s P&amp;L. <a href="23-the-message.html"><strong>Start chapter XXIII →</strong></a></div>
    ${missed.length ? `<div class="review no-print" style="margin-top:28px"><div class="eyebrow">Worth another look</div>${[...new Map(missed.map(x => [x.ch, x])).values()].map(x => `<a href="${chapters[x.ch - 1].slug}.html"><b>${chapters[x.ch - 1].roman}. ${chapters[x.ch - 1].title}</b><span>→</span></a>`).join('')}</div>` : ''}`;
  $('#nm').addEventListener('input', e => store.set('name', e.target.value));
  $('#print').onclick = () => print(); $('#again').onclick = () => { marks.length = 0; again(); };
  DCC.markDone(); DCC.playSuccess();
  if (s >= n * .75) [0, 300, 600].forEach((ms, i) => setTimeout(() => DCC.burstConfetti(innerWidth * (i + 1) / 4, 220), ms));
}
const marks = [];
DCC.quiz($('#game'), { items: QS, shuffle: true, label: 'Question', nextLabel: 'Next question →', endLabel: 'See my diploma →', onAnswer: (x, o, i) => { marks[i] = !!o.ok; }, onEnd: diploma });
}
</script>
</body>
</html>
